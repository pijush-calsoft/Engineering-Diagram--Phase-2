[project]
name = "edp"
version = "0.0.0"
description = "AI-Powered Engineering Diagram Platform (monorepo root)"
requires-python = ">=3.11"
dependencies = ["edp-contracts", "edp-eval", "edp-ci", "edp-kit", "edp-fabric", "edp-catalogue", "edp-orchestrator", "edp-b1-parser"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts", "eval", "scripts/ci", "platform/kit", "platform/fabric", "platform/catalogue", "orchestrator", "blocks/b1_parser"]

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-eval = { workspace = true }
edp-ci = { workspace = true }
edp-kit = { workspace = true }
edp-fabric = { workspace = true }
edp-catalogue = { workspace = true }
edp-orchestrator = { workspace = true }
edp-b1-parser = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "eval/tests", "scripts/ci/tests", "platform/kit/tests", "platform/fabric/tests", "platform/catalogue/tests", "orchestrator/tests", "blocks/b1_parser/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["edp_contracts", "edp_eval", "edp_ci", "edp_kit", "edp_fabric", "edp_catalogue", "edp_orchestrator", "edp_b1_parser"]

[tool.mypy]
python_version = "3.11"
strict = false
plugins = ["pydantic.mypy"]
