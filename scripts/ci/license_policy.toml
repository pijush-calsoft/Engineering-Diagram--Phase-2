# Licence policy for the CI licence gate (edp_ci.license_gate).
#
# Source: plan section 9 "License policy and watch-list". Human-readable version:
# docs/policies/license-policy.md. Licences are "listed as understood at the time of
# writing" and must be confirmed in Phase 0 with the licence scan and, where flagged,
# with legal (plan section 4 preamble).
#
# Ids are SPDX-like. The gate maps metadata text (for example the trove classifier
# "MIT License") to these ids with a small table in license_gate.py.
#
# Any licence id that is not listed below is "unknown" and fails the gate
# ("CI fails on unapproved licenses", plan section 9).

[allowed]
# Plan section 9: "Permissive licenses (MIT, BSD, Apache 2.0, PostgreSQL, MPL 2.0) are
# allowed anywhere."
ids = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # "BSD" = metadata that says BSD without a clause count (for example the trove
    # classifier "License :: OSI Approved :: BSD License"). Plan section 9 also says
    # "BSD" without a variant. Confirm in Phase 0.
    "BSD",
    "Apache-2.0",
    "PostgreSQL",
    "MPL-2.0",
    # NOT NAMED IN PLAN SECTION 9. Proposed, needs confirmation by the accountable
    # owner and legal. PSF-2.0 is the licence that typing_extensions declares, and
    # pydantic depends on typing_extensions. Accepted only through the id PSF-2.0
    # (for example License-Expression). The unversioned trove classifier "Python
    # Software Foundation License" is not mapped and stays unknown.
    "PSF-2.0",
    # NOT NAMED IN PLAN SECTION 9. Proposed, needs confirmation by the accountable
    # owner and legal. No installed distribution uses it at the time of writing.
    "ISC",
]

[conditional]
# Plan section 9: "LGPL is allowed when used as a library without modification."
# The gate prints a warning for these and passes. It cannot check "without
# modification"; that is a review item.
ids = [
    "LGPL",
    "LGPL-2.0-only",
    "LGPL-2.0-or-later",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
]

[denied_in_process]
# Plan section 9: "GPL tools run as separate processes or containers" and "AGPL
# components are not imported into our services". A Python distribution installed in
# a service environment counts as in-process, so the gate fails on these.
# SSPL and BUSL/BSL: plan section 9 watch-list replaces Redis 8+ (AGPL / SSPL / RSAL)
# with Valkey, and HashiCorp Vault and Terraform (BSL) with OpenBao and OpenTofu.
ids = [
    "GPL",
    "GPL-2.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL",
    "AGPL-1.0-only",
    "AGPL-1.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    # SSPL, BUSL and RSAL: derived from the plan section 9 watch-list (Redis 8+
    # "AGPL / SSPL / RSAL"; HashiCorp Vault and Terraform "BSL"), not from the
    # section 9 policy text. The plan gives no version for any of them.
    # "SSPL" and "BUSL" (no version) are for metadata that names the licence without
    # a version. BUSL-1.0 and BUSL-1.1: versions of the BSL named in the section 9
    # watch-list; the plan gives no version. Confirm in Phase 0.
    "SSPL",
    "SSPL-1.0",
    "BUSL",
    "BUSL-1.0",
    "BUSL-1.1",
    "RSAL",
    # GPL-1.0-*: GPL per the section 9 policy text.
    "GPL-1.0-only",
    "GPL-1.0-or-later",
]

[exceptions]
# Distribution name (PEP 503 normalised, for example "foo-bar") = "reason".
# An exception only clears an "unknown" result, where the metadata cannot be mapped
# to an id above. It never clears a denied_in_process result; the gate still fails.
# The gate also ignores an exception when the metadata text names GPL, AGPL, Affero
# or "General Public License" (unless the same segment says "Lesser" or "Library"),
# or SSPL, BSL, BUSL, "Business Source License" or RSAL. That check is a text match,
# so read the metadata yourself before adding an entry.
# Quote what the distribution's metadata actually says in the reason.
# Never add GPL, AGPL, SSPL, BSL/BUSL or RSAL packages here.
numpy = "Metadata License-Expression: 'BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0'. 0BSD, Zlib and CC0-1.0 are permissive but not named in plan section 9; pending sign-off under OD-31. Required by ezdxf (plan section 4.2 block 1). Added 2026-11-24."
sqlite-vec = "Metadata License: 'MIT License, Apache License, Version 2.0' (one comma-separated string the gate cannot split; no License-Expression). MIT and Apache-2.0 are both allowed by plan section 9. Required by langgraph-checkpoint-sqlite (ADR-0008). Added 2026-11-24."
pypdfium2 = "Metadata License: 'BSD-3-Clause, Apache-2.0, dependency licenses' (one string the gate cannot split). The wheel bundles PDFium (BSD-3-Clause) and its build dependencies; their texts are in dist-info/licenses/BUILD_LICENSES. Reviewed 2026-11-25: FreeType is under the FreeType Project License (FTL), ICU's only GPL text is the Autoconf build-script exception, musl/android/libgcc files do not apply to the Windows build. Plan section 4.2 block 1 names pypdfium2. Pending sign-off under OD-31."
