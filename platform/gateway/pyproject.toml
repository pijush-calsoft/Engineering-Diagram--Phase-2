[project]
name = "edp-gateway"
version = "0.1.0"
description = "Model Gateway: role routing, redaction, guardrails, usage and cost log (plan Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "edp-contracts",
    "litellm>=1.111",
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_gateway"]

[tool.uv.sources]
edp-contracts = { workspace = true }
