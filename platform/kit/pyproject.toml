[project]
name = "edp-kit"
version = "0.1.0"
description = "Shared service kit: event bus and block service app factory (plan sections 2.2, 3)"
requires-python = ">=3.11"
dependencies = [
    "edp-contracts",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_kit"]

[tool.uv.sources]
edp-contracts = { workspace = true }
