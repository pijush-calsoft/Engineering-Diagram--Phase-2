[project]
name = "edp-catalogue"
version = "0.1.0"
description = "Data Catalogue: artifact registry and element-level lineage (plan Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "edp-contracts",
    "edp-kit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_catalogue"]

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-kit = { workspace = true }
