[project]
name = "edp-fabric"
version = "0.1.0"
description = "Data Fabric: upload, zones, versioning, fabric events (plan Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "edp-contracts",
    "edp-kit",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_fabric"]

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-kit = { workspace = true }
