[project]
name = "edp-contracts"
version = "0.1.0"
description = "Plug-in contract v0.1 and artifact schemas for the Engineering Diagram Platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_contracts"]
