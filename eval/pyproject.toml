[project]
name = "edp-eval"
version = "0.1.0"
description = "Evaluation harness: golden dataset manifests and metrics (plan section 7)"
requires-python = ">=3.11"
dependencies = [
    "edp-b1-parser",
    "edp-b2-interpretation",
    "edp-b3-knowledge-graph",
    "edp-contracts",
    "edp-gateway",
    "ezdxf>=1.3",
    "opencv-python-headless>=4.10",
    "pydantic>=2.7,<3",
    "pypdfium2>=4.30",
]

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-gateway = { workspace = true }
edp-b2-interpretation = { workspace = true }
edp-b3-knowledge-graph = { workspace = true }
edp-b1-parser = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_eval"]
