[project]
name = "edp-eval"
version = "0.1.0"
description = "Evaluation harness: golden dataset manifests and metrics (plan section 7)"
requires-python = ">=3.11"
dependencies = [
    "edp-b1-parser",
    "edp-contracts",
    "ezdxf>=1.3",
    "pydantic>=2.7,<3",
]

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-b1-parser = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_eval"]
