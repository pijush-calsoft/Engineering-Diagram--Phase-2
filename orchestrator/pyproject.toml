[project]
name = "edp-orchestrator"
version = "0.1.0"
description = "Orchestrator: LangGraph planner graph with block nodes (plan Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "edp-catalogue",
    "edp-contracts",
    "edp-fabric",
    "edp-gateway",
    "edp-kit",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_orchestrator"]

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-kit = { workspace = true }
edp-fabric = { workspace = true }
edp-catalogue = { workspace = true }
edp-gateway = { workspace = true }
