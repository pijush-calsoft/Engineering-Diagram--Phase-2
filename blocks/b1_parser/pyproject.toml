[project]
name = "edp-b1-parser"
version = "0.1.0"
description = "Block 1: Drawing Parser (plan Phase 2)"
requires-python = ">=3.11"
dependencies = ["edp-contracts", "edp-kit", "edp-fabric", "ezdxf>=1.3", "pydantic>=2.7,<3"]

[project.entry-points."edp.blocks"]
b1_parser = "edp_b1_parser:DrawingParser"

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-kit = { workspace = true }
edp-fabric = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_b1_parser"]
