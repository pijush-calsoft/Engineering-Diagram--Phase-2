[project]
name = "edp-b4-generation"
version = "0.1.0"
description = "Block 4: Generation, design graph to an editable CadQuery script (plan Phase 4)"
requires-python = ">=3.11"
dependencies = ["edp-contracts", "edp-kit", "edp-fabric", "pydantic>=2.7,<3"]

[project.entry-points."edp.blocks"]
b4_generation = "edp_b4_generation:Generation"

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-kit = { workspace = true }
edp-fabric = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_b4_generation"]
