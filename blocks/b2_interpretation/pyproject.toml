[project]
name = "edp-b2-interpretation"
version = "0.1.0"
description = "Block 2: Interpretation, geometry to design graph (plan Phase 3)"
requires-python = ">=3.11"
dependencies = [
    "edp-contracts",
    "edp-kit",
    "edp-fabric",
    "pydantic>=2.7,<3",
    "pint>=0.24",
]

[project.entry-points."edp.blocks"]
b2_interpretation = "edp_b2_interpretation:Interpretation"

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-kit = { workspace = true }
edp-fabric = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_b2_interpretation"]
