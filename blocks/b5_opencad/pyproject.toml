[project]
name = "edp-b5-opencad"
version = "0.1.0"
description = "Block 5: OpenCAD Adapters, sandbox run, validity, dimensional check, STEP export (plan Phase 4)"
requires-python = ">=3.11"
dependencies = ["edp-contracts", "edp-kit", "edp-fabric", "pydantic>=2.7,<3", "cadquery>=2.5"]

[project.entry-points."edp.blocks"]
b5_opencad = "edp_b5_opencad:OpenCadAdapters"

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-kit = { workspace = true }
edp-fabric = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_b5_opencad"]
