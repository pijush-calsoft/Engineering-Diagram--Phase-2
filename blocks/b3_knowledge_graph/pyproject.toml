[project]
name = "edp-b3-knowledge-graph"
version = "0.1.0"
description = "Block 3: Knowledge Graph, relations, similar parts, corroboration (plan Phase 3)"
requires-python = ">=3.11"
dependencies = ["edp-contracts", "edp-kit", "edp-fabric", "pydantic>=2.7,<3"]

[project.entry-points."edp.blocks"]
b3_knowledge_graph = "edp_b3_knowledge_graph:KnowledgeGraph"

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-kit = { workspace = true }
edp-fabric = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_b3_knowledge_graph"]
