[project]
name = "edp-b8-report"
version = "0.1.0"
description = "Block 8: Insight and report, fact-checked descriptive report with DOCX export (plan Phase 6)"
requires-python = ">=3.11"
dependencies = ["edp-contracts", "edp-kit", "edp-fabric", "pydantic>=2.7,<3", "python-docx>=1.1"]

[project.entry-points."edp.blocks"]
b8_report = "edp_b8_report:InsightReport"

[tool.uv.sources]
edp-contracts = { workspace = true }
edp-kit = { workspace = true }
edp-fabric = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edp_b8_report"]
